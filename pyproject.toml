[project]
name = "relay"
version = "0.1.0"
description = "Relay — a production-grade AI support-triage agent (FastAPI + Claude API)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hesam Abbaszadi" }]
dependencies = [
    "anthropic>=0.60",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    # 2.0 API: Server(on_list_tools=...), Tool(input_schema=...), CallToolResult(is_error=...).
    # Floored at 2.0 because no test calls create_server, so a 1.x resolve would TypeError at
    # startup with a green suite (v1.0 milestone audit, F-2).
    "mcp>=2.0",
    "limits>=5.8,<6",
    # Semantic retrieval (phase 3). Cosine similarity over the prebuilt kb index.
    # Floor stays at 2.3 and NOT 2.5: numpy 2.5+ declares requires-python >=3.12,
    # which would silently strip this project of its own >=3.11 floor (no candidate
    # resolves on 3.11). 2.3.x/2.4.x still ship >=3.11 wheels, so pip picks 2.4.x on
    # 3.11 and 2.5.x on 3.12+ — one constraint, both interpreters.
    "numpy>=2.3,<3",
    # Promoted from the dev extra: the Voyage embeddings POST is runtime code now.
    # Already in the tree transitively via anthropic (httpx<1,>=0.25.0).
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # httpx moved to [project] dependencies — TestClient still gets it from there.
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
