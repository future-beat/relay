# fly.toml app configuration file for relay-agent
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'relay-agent'
primary_region = 'syd'
# Fly's default is 5 seconds: SIGTERM, then SIGKILL before the lifespan drain has even
# started, which would make every line of shutdown code decorative. 30 covers a typical
# ~20s run plus lifespan teardown and stays well under Fly's 300 maximum. Top-level on
# purpose — a bare key placed after a table header is parsed into that table.
# Deliberately no kill_signal: Fly's own docs contradict themselves on the default, and
# uvicorn handles SIGINT and SIGTERM identically, so pinning one is the only way to
# break a mechanism that already works.
kill_timeout = 30

[build]

[env]
  RELAY_DB_PATH = '/data/relay.db'
  # Must match http_service.internal_port below; the container binds $PORT.
  PORT = '8080'
  # Only here: behind the Fly proxy, Fly-Client-IP is authoritative. Off-proxy the
  # header is client-controlled, so trusting it anywhere else is a rate-limit bypass.
  RELAY_TRUST_PROXY = 'true'

[[mounts]]
  source = 'relay_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
