# fly.toml app configuration file for relay-agent
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'relay-agent'
primary_region = 'syd'
# Fly's default is 5 seconds: SIGTERM, then SIGKILL before the lifespan drain has even
# started, which would make every line of shutdown code decorative. 30 covers a typical
# ~20s run plus lifespan teardown and stays well under Fly's 300 maximum. Top-level on
# purpose — a bare key placed after a table header is parsed into that table.
# Deliberately no kill_signal: Fly's own docs contradict themselves on the default, and
# uvicorn handles SIGINT and SIGTERM identically, so pinning one is the only way to
# break a mechanism that already works.
kill_timeout = 30

[build]

[env]
  RELAY_DB_PATH = '/data/relay.db'
  # Must match http_service.internal_port below; the container binds $PORT.
  PORT = '8080'
  # Only here: behind the Fly proxy, Fly-Client-IP is authoritative. Off-proxy the
  # header is client-controlled, so trusting it anywhere else is a rate-limit bypass.
  RELAY_TRUST_PROXY = 'true'

[[mounts]]
  source = 'relay_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

# Probes /health because it is public, unmetered and does no DB or Claude API work, so
# a check every 30s costs nothing. timeout is 5s, not the Dockerfile HEALTHCHECK's 3s:
# a worker holding the DB lock has stalled the event loop for a measured ~0.81s,
# shared-cpu jitter stacks on top, and 5s is busy_timeout, the bound on that stall.
# grace_period covers a cold start, observed at ~5s to wake from stopped. A failing
# check does not restart the machine: Fly only stops routing to it and fails
# `fly deploy`. Crash and OOM recovery is the restart policy's job (default
# on-failure). Checks are not proxied traffic, so they never keep the scale-to-zero
# machine awake.
[[http_service.checks]]
  method = 'GET'
  path = '/health'
  interval = '30s'
  timeout = '5s'
  grace_period = '10s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
