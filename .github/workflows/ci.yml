name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t relay:ci .
      - name: Smoke test container
        run: |
          docker run -d --name relay -p 8000:8000 -e ANTHROPIC_API_KEY=ci-placeholder relay:ci
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8000/health; then exit 0; fi
            sleep 1
          done
          echo "health check never came up" >&2
          docker logs relay >&2
          exit 1
