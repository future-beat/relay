name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t relay:ci .
      # /health alone cannot see either of this image's two silent-loss modes, so the
      # smoke waits for the process and then requires the two public GET surfaces to
      # answer from the BUILT artifact:
      #   /dashboard  — the page is a non-.py file inside the package (D-04). Hatchling
      #                 honours .gitignore, so a future ignore rule can drop it from the
      #                 wheel with no build error, and pytest reads the source tree
      #                 either way. This curl is the only automated check that sees it.
      #   /metrics    — the daily buckets use SQLite window functions (ROW_NUMBER OVER).
      #                 The runtime image's libsqlite3 is not the developer's; a build
      #                 without them 500s here rather than in production.
      # Both are asserted non-empty and for expected content: `curl -sf` alone would
      # pass on a 200 that served nothing.
      - name: Smoke test container
        run: |
          docker run -d --name relay -p 8000:8000 -e ANTHROPIC_API_KEY=ci-placeholder relay:ci
          up=""
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8000/health; then up=yes; break; fi
            sleep 1
          done
          if [ -z "$up" ]; then
            echo "health check never came up" >&2
            docker logs relay >&2
            exit 1
          fi
          if ! curl -sf http://127.0.0.1:8000/dashboard | grep -q "Relay"; then
            echo "/dashboard did not serve the page — template missing from the image?" >&2
            docker logs relay >&2
            exit 1
          fi
          if ! curl -sf http://127.0.0.1:8000/metrics | grep -q '"outcome_distribution"'; then
            echo "/metrics did not answer — SQLite window functions missing?" >&2
            docker logs relay >&2
            exit 1
          fi
          echo "smoke ok: /health, /dashboard, /metrics"
