name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t relay:ci .
      # /health alone cannot see either of this image's two silent-loss modes, so the
      # smoke waits for the process and then requires the two public GET surfaces to
      # answer from the BUILT artifact:
      #   /dashboard  — the page is a non-.py file inside the package (D-04). Hatchling
      #                 honours .gitignore, so a future ignore rule can drop it from the
      #                 wheel with no build error, and pytest reads the source tree
      #                 either way. This curl is the only automated check that sees it.
      #   /metrics    — the daily buckets use SQLite window functions (ROW_NUMBER OVER).
      #                 The runtime image's libsqlite3 is not the developer's; a build
      #                 without them 500s here rather than in production.
      # Both are asserted non-empty and for expected content: `curl -sf` alone would
      # pass on a 200 that served nothing.
      #
      # The /dashboard patterns are markup only the SHIPPED page has (WR-08). The old
      # `grep -q "Relay"` was satisfied by `<title>Relay dashboard</title>` alone, so an
      # image serving an empty <body> printed "smoke ok" — and a served-but-broken page
      # is the one failure mode this curl uniquely adds, since a missing template
      # already stops /health from ever coming up. tests/test_dashboard.py pins these
      # same tokens against the served page, so the two cannot drift apart silently.
      #
      # The container is then started a SECOND time against the same volume, because
      # that is the only place CI runs this image against a database that already
      # exists — which is the entire stated purpose of _add_column_if_missing (db.py),
      # written to be safe against the table already on the Fly volume and until now
      # never exercised that way anywhere.
      - name: Smoke test container
        run: |
          docker volume create relay-ci-data

          start() {   # start <container-name>
            docker run -d --name "$1" -p 8000:8000 -v relay-ci-data:/data \
              -e ANTHROPIC_API_KEY=ci-placeholder relay:ci
            up=""
            for i in $(seq 1 15); do
              if curl -sf http://127.0.0.1:8000/health; then up=yes; break; fi
              sleep 1
            done
            if [ -z "$up" ]; then
              echo "[$1] health check never came up" >&2
              docker logs "$1" >&2
              exit 1
            fi
          }

          want() {    # want <container-name> <path> <pattern> <explanation>
            if ! curl -sf "http://127.0.0.1:8000$2" | grep -qF -- "$3"; then
              echo "[$1] $2 did not contain $3 — $4" >&2
              docker logs "$1" >&2
              exit 1
            fi
          }

          start relay
          want relay /dashboard 'id="try-examples"' "the page served no Try-it panel"
          want relay /dashboard 'openDrill' "the page served no drill-down"
          want relay /metrics '"outcome_distribution"' "SQLite window functions missing?"

          # Second boot, same volume: init_db now runs against tables that exist.
          docker rm -f relay
          start relay-again
          want relay-again /metrics '"outcome_distribution"' "migration against an existing DB failed"
          want relay-again /dashboard 'id="try-examples"' "the page broke on the second boot"

          echo "smoke ok: /health, /dashboard, /metrics — twice, second time on an existing volume"
